name: Deploy dashboard to GitHub Pages

# Publishes the static dashboard in site/ to GitHub Pages as a no-auth demo: with no MSAL
# config it falls back to the bundled, same-origin site/data/data.duckdb (the demo DB).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; let an in-progress run finish (don't cancel a live publish).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble publish dir (no-auth, bundled demo data)
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # No-auth config so config.js exists (no 404) and same-origin demo data is used.
          cp site/config.static.example.js _site/config.js

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
